<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ink Projector · Output</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    body { cursor: crosshair; }
    body.idle { cursor: none; }
    .hint {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif; color: #9aa0aa;
      background: rgba(20, 22, 26, 0.85); border: 1px solid #2a2d35; border-radius: 999px;
      padding: 8px 16px; transition: opacity 0.8s; white-space: nowrap;
    }
    .hint.gone { opacity: 0; pointer-events: none; }
    .preview .hint { display: none; }
    .qr {
      position: fixed; right: 3vmin; bottom: 3vmin; width: clamp(90px, 15vmin, 260px);
      display: flex; flex-direction: column; align-items: center; gap: 1vmin;
      font: 600 clamp(9px, 1.5vmin, 22px)/1.25 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffe2b0; text-align: center;
    }
    .qr[hidden] { display: none; }
    .qr canvas { width: 100%; height: auto; display: block; image-rendering: pixelated; border-radius: 4px; }
    .qr p { margin: 0; }
  </style>
</head>
<body>
  <canvas id="out"></canvas>
  <div class="hint" id="hint">Drag this window to the projector, then press F for full screen. M lines it up with the wall. Draw right on it with the mouse.</div>
  <div class="qr" id="qr" hidden>
    <canvas></canvas>
    <p>Scan to draw<br>on the doorway</p>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script type="module" src="output.js?v=10"></script>
</body>
</html>
