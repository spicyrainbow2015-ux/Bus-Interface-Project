<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Draw on the Wall</title>
  <style>
    :root {
      --bg: #101114; --card: #1a1c21; --line: #2c2f37; --text: #f1f1f3; --muted: #9a9ea8;
      --accent: #ffd27a; --btn: #f3efe6; --btn-text: #15161a; --danger: #ff7a7a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; } /* no double-tap zoom */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { margin: 0; background: var(--bg); color: var(--text); overscroll-behavior: none; }
    body {
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      max-width: 560px; margin: 0 auto;
    }
    h1 { font-size: 24px; margin: 4px 0 4px; letter-spacing: -0.01em; }
    .lede { color: var(--muted); margin: 0 0 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    button {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 44px; padding: 10px 14px; border-radius: 12px; cursor: pointer;
      font: 600 15px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #23262d; color: var(--text); border: 1px solid var(--line);
    }
    #mapCv { width: 100%; display: block; border-radius: 10px; background: #07080a; touch-action: manipulation; }
    .shape-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .shape-btns button { justify-content: flex-start; min-height: 52px; }
    .shape-btns i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
    .msg { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
    .msg.err { color: var(--danger); }
    .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    #miniCv { flex: 1; min-width: 0; height: 64px; display: block; border-radius: 8px; touch-action: manipulation; }
    .bar #btnSound { flex: none; width: 44px; padding: 0; }
    .pager { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pager button { width: 44px; padding: 0; font-size: 22px; flex: none; }
    .pager button:disabled { opacity: 0.3; }
    .label { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 17px; }
    .label i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
    .label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .label small { color: var(--muted); font-weight: 500; font-size: 14px; flex: none; }
    .stagebox { display: flex; justify-content: center; margin-bottom: 8px; }
    .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
    .dots button { min-height: 0; width: 10px; height: 10px; padding: 0; border: 0; border-radius: 5px; opacity: 0.35; transition: width 0.2s, opacity 0.2s; }
    .dots button.on { width: 26px; opacity: 1; }
    #drawCv { display: block; background: #f6f3ec; border-radius: 6px; box-shadow: 0 0 0 2px var(--accent); touch-action: none; }
    .brushes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .brushes button { min-height: 38px; padding: 6px 12px; font-size: 14px; flex: none; }
    .brushes button.on { background: #3a3220; border-color: var(--accent); color: var(--accent); }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .swatch { width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 50%; border: 2px solid transparent; }
    .swatch.on { border-color: #fff; box-shadow: 0 0 0 2px var(--bg) inset; }
    .row { display: flex; align-items: center; gap: 12px; }
    label.size { flex: 1; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
    #btnClear { flex: none; min-height: 40px; padding: 8px 14px; font-size: 14px; }
    #btnClear.armed { background: #3a1f22; border-color: var(--danger); color: var(--danger); }
    #btnEraser { flex: none; min-height: 40px; padding: 8px 14px; font-size: 14px; }
    #btnEraser.on { background: #3a3220; border-color: var(--accent); color: var(--accent); }
    label.size input { flex: 1; accent-color: var(--accent); }
    .live { font-size: 13px; color: var(--muted); text-align: center; margin: 8px 0 0; }
    .live.err { color: var(--danger); }
    [hidden] { display: none !important; }

    /* Phone held sideways: the whole wall, every box where it's mapped, drawn on directly */
    .wallbox, .tools-head { display: none; }
    .wall-in { position: relative; margin: 0 auto; background: #07080a; border-radius: 8px; overflow: hidden; touch-action: none; }
    .wall-in canvas.in-wall { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #f6f3ec; border-radius: 0; touch-action: none; }
    .wall-label { position: absolute; transform: translate(-50%, -125%); font: 600 12px -apple-system, BlinkMacSystemFont, sans-serif;
      white-space: nowrap; pointer-events: none; text-shadow: 0 1px 2px #000; }
    .wall-label.on::before { content: "✎ "; }
    body.wallmode { max-width: none; padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); }
    body.wallmode #stepDraw:not([hidden]) { display: flex; gap: 12px; align-items: flex-start; }
    body.wallmode .draw-main { flex: 1; min-width: 0; }
    body.wallmode .bar, body.wallmode .pager, body.wallmode .stagebox, body.wallmode .dots { display: none; }
    body.wallmode .wallbox { display: block; }
    body.wallmode .tools { width: 220px; flex: none; max-height: calc(100vh - 16px); overflow-y: auto; }
    body.wallmode .tools-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; font-size: 15px; }
    body.wallmode .tools-head span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    body.wallmode .tools-head i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    body.wallmode .tools-head #btnSound { width: 40px; min-height: 36px; padding: 0; flex: none; }
    body.wallmode .brushes { flex-wrap: wrap; overflow: visible; }
    body.wallmode .brushes button { min-height: 32px; padding: 4px 9px; font-size: 13px; }
    body.wallmode .swatches { gap: 6px; margin: 8px 0; }
    body.wallmode .swatch { width: 28px; height: 28px; }
    body.wallmode .row { flex-wrap: wrap; gap: 8px; }
    body.wallmode label.size { flex-basis: 100%; }
    body.wallmode #btnEraser, body.wallmode #btnClear { flex: 1; min-height: 36px; padding: 6px 8px; }
    body.wallmode .live { text-align: left; }
  </style>
</head>
<body>
  <!-- 1. Pick a shape -->
  <div id="stepMap">
    <h1>Draw on the Wall</h1>
    <p class="lede">These are the shapes on the wall. Tap one to draw in it. Your lines appear on the wall as you draw, and you can swipe to the other shapes.</p>
    <div class="card">
      <canvas id="mapCv"></canvas>
      <div class="shape-btns" id="shapeBtns"></div>
      <p class="msg" id="mapMsg">Loading…</p>
    </div>
  </div>

  <!-- 2. Draw -->
  <div id="stepDraw" hidden>
   <div class="draw-main">
    <div class="bar" id="bar">
      <canvas id="miniCv" aria-label="The wall. Tap a box to draw in it."></canvas>
      <button id="btnSound" aria-label="Sound">🔊</button>
    </div>
    <div class="pager">
      <button id="btnPrev" aria-label="Previous box">‹</button>
      <div class="label"><i id="shapeDot"></i><span id="shapeName"></span><small id="shapePos"></small></div>
      <button id="btnNext" aria-label="Next box">›</button>
    </div>
    <div class="stagebox" id="stagebox"><canvas id="drawCv"></canvas></div>
    <div class="wallbox" id="wallBox"><div class="wall-in" id="wallIn"></div></div>
    <div class="dots" id="dots"></div>
   </div>
   <div class="tools" id="tools">
    <div class="tools-head" id="toolsHead"><i></i><span></span></div>
    <div class="brushes" id="brushes"></div>
    <div class="swatches" id="swatches"></div>
    <div class="row">
      <label class="size">Size <input type="range" id="size" min="2" max="36" step="1" value="8"></label>
      <button id="btnEraser" aria-label="Eraser">Eraser</button>
      <button id="btnClear">Clear</button>
    </div>
    <p class="live" id="live">Draw inside the box. It shows up on the wall in about a second.</p>
   </div>
  </div>

  <script>
    // iPhones ignore "no zoom" in the viewport tag, so stop pinch zoom here (touch-action stops double-tap zoom)
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 && !e.target.closest('#drawCv')) e.preventDefault(); }, { passive: false });
  </script>
  <script type="module" src="draw.js?v=10"></script>
</body>
</html>
