<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>City Connector — screen demo (E8)</title>
<!-- Prototyping only: Montserrat + DM Mono load from Google (no local
     files for those two). Sniglet is self-hosted via city-connector.css
     (the .ttf you sent), so it's not requested here too. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="city-connector.css">
<style>body { margin: 0; background: #000; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding-top: 4vh; }</style>
</head>
<body>

<!-- Put this once anywhere in <body>: the hand-drawn wobble used by bubbles + route line -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="cc-wobble" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="4"/>
  </filter>
</svg>

<main class="cc-screen">

  <header class="cc-topbar">
    <div class="cc-brand">City Connector<span class="cc-brand__dot">.</span></div>
    <div class="cc-stop" data-bind="stopName">Chestnut St &amp; 43rd St</div>
  </header>

  <section class="cc-bus" aria-label="Next bus">
    <div class="cc-bus__left">
      <div class="cc-bus__row">
        <span class="cc-route-pill" data-bind="route">21</span>
        <span class="cc-bus__note" data-bind="arrivalNote">arrives 12:10 am</span>
      </div>
      <div class="cc-destination" data-bind="destination">Columbus-Dock</div>
    </div>
    <!-- add class "cc-eta--scheduled" when the time isn't live -->
    <div class="cc-eta" id="eta">
      <span class="cc-eta__num" data-bind="minutes">26</span>
      <span class="cc-eta__unit">MIN</span>
    </div>
  </section>

  <!-- Following bus — hidden by JS whenever there's no second confirmed
       arrival to show (never filled with placeholder dashes). -->
  <section class="cc-bus2" id="bus2" aria-label="Following bus" hidden>
    <div class="cc-bus2__left">
      <span class="cc-route-pill" data-bind="route2">21</span>
      <span class="cc-bus2__dest" data-bind="destination2">Columbus-Dock</span>
      <span class="cc-bus2__note" data-bind="arrivalNote2">arrives 12:10 am</span>
    </div>
    <div class="cc-bus2__eta" id="eta2">
      <span class="cc-bus2__eta-num" data-bind="minutes2">26</span>
      <span class="cc-bus2__eta-unit">MIN</span>
    </div>
  </section>

  <section class="cc-chamber" aria-label="What people feel at this stop">
    <svg class="cc-route-line" viewBox="0 0 516 700" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-10 170 C 60 150 120 190 170 140 S 300 20 380 120 S 520 150 520 300"/>
      <path d="M-10 690 C 80 650 150 700 250 520 S 420 700 530 610"/>
      <circle cx="170" cy="140" r="7"/><circle cx="380" cy="120" r="7"/><circle cx="250" cy="520" r="7"/>
    </svg>

    <!-- Call to action: a specific question + big QR, at eye level -->
    <div class="cc-cta">
      <div class="cc-cta__text">
        <div class="cc-cta__question">Share a memory for this stop?</div>
        <div class="cc-cta__sub"><span data-bind="peopleCount">121</span> people have answered · a quick scan to submit!</div>
      </div>
      <div class="cc-qr"><!-- your real QR code <img> or <svg> goes here --></div>
    </div>

    <!-- two small decorative dots (no words) -->
    <div class="cc-bubble cc-bubble--red cc-float-1" style="--d:52; --x:300; --y:722; animation-delay:-3s"></div>
    <div class="cc-bubble cc-bubble--blue cc-float-1" style="--d:22; --x:470; --y:294; animation-delay:-2s"></div>

    <!-- Bubbles are rendered by the script below from your keyword data -->
    <div id="bubbles"></div>

    <div class="cc-route-note">Route <span data-bind="route">21</span> →</div>

    <article class="cc-postcard" id="postcard">
      <div class="cc-postcard__tape"></div>
      <img class="cc-postcard__photo" data-bind-src="photo" src="images/featured.jpg" alt="">
      <p class="cc-postcard__quote">“<span data-bind="quote">Midway under snow storm!</span>”</p>
      <!-- Shown only while .is-fresh (right after a new submission is
           processed) — see swapPostcard()/playEnvelopeReveal() below. -->
      <div class="cc-postcard__tags">
        <span class="cc-postcard__new-pill">New submission</span>
        <div class="cc-postcard__tag-list" id="postcardTagList"></div>
      </div>
      <div class="cc-postcard__meta">
        <span data-bind="author">Lucy Huang</span>
        <span data-bind="date">2022/ 01/03</span>
      </div>
    </article>

    <!-- Plays once whenever a submission finishes Phase 2 ("Refresh themes")
         — see playEnvelopeReveal() in the script. The "open" state is a
         clone of #postcard itself (same classes: tilt, conditional photo,
         tag row, meta) so opening the envelope really does look like it's
         becoming the new postcard, not a different-looking overlay. -->
    <div class="cc-envelope" id="envelope" aria-live="polite">
      <div class="cc-envelope__closed">
        <svg class="cc-envelope__svg" viewBox="0 0 412 320" preserveAspectRatio="none" aria-hidden="true">
          <rect x="6" y="60" width="400" height="254" rx="16" fill="var(--cc-paper)" stroke="#141310" stroke-width="3.5"/>
          <polyline points="6,60 206,210 406,60" fill="none" stroke="#141310" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="butt"/>
          <circle cx="206" cy="190" r="20" fill="var(--cc-lime)" stroke="#141310" stroke-width="3"/>
        </svg>
      </div>
      <article class="cc-envelope__open cc-postcard is-fresh">
        <div class="cc-postcard__tape"></div>
        <img class="cc-postcard__photo" id="envPhoto" alt="">
        <p class="cc-postcard__quote" id="envQuote"></p>
        <div class="cc-postcard__tags">
          <span class="cc-postcard__new-pill">New submission</span>
          <div class="cc-postcard__tag-list" id="envTagList"></div>
        </div>
        <div class="cc-postcard__meta">
          <span id="envAuthor"></span>
          <span id="envDate"></span>
        </div>
      </article>
    </div>
  </section>

</main>

<!-- Testing scaffolding, not part of the projection design — fixed so it
     doesn't disturb the .cc-screen grid centering. Real submissions (via
     /submit.html) already appear here on their own within ~15s (the
     regular fetchPerspectives poll) — no button needed for that. This is
     just the one manual step that's still deliberate: "Refresh themes" is
     Phase 2, the only thing that calls Claude, and only runs when clicked. -->
<div id="devstrip" style="position:fixed; left:12px; bottom:12px; z-index:10; background:rgba(255,255,255,.94); border:1px dashed #999; border-radius:8px; padding:10px 12px; font:12px/1.4 system-ui, sans-serif; max-width:320px; color:#222;">
  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <button id="refreshBtn" style="font:inherit; font-weight:700; padding:6px 12px; border-radius:999px; border:1px solid #999; background:#fff; cursor:pointer;">Refresh themes (real AI call)</button>
  </div>
  <div id="simulateStatus" style="margin-top:6px; color:#555;"></div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Minimal wiring, as shipped in the design — kept as-is.
   --------------------------------------------------------------------------- */

// Fixed spots in the chamber (design px), biggest spot first.
// Keeping positions fixed avoids jitter/overlap on a public screen.
const SLOTS = [
  { x: 342, y: 556, max: 156 }, { x: 24,  y: 144, max: 118 },
  { x: 56,  y: 636, max: 104 }, { x: 264, y: 140, max: 88  },
  { x: 196, y: 660, max: 82  }, { x: 170, y: 168, max: 66  },
  { x: 440, y: 144, max: 58  }, { x: 452, y: 340, max: 56  },
];
const COLORS = ['mint', 'red', 'pink', 'blue', 'blue', 'mint', 'pink', 'red']; // one per slot, so neighbours differ
const FLOATS = ['cc-float-2', 'cc-float-1', 'cc-float-3'];

function renderBubbles(keywords) {
  const top = [...keywords].sort((a, b) => b.count - a.count).slice(0, SLOTS.length);
  const maxCount = top[0]?.count || 1;
  const MAX_D = 156, MIN_D = 50;
  document.getElementById('bubbles').innerHTML = top.map((k, i) => {
    const slot = SLOTS[i];
    // area tracks count: diameter ∝ √count (top word = MAX_D), clamped, never bigger than its slot
    const d = Math.round(Math.min(slot.max, Math.max(MIN_D, MAX_D * Math.sqrt(k.count / maxCount))));
    const cx = slot.x + (slot.max - d) / 2, cy = slot.y + (slot.max - d) / 2; // keep centred in slot
    return `<div class="cc-bubble cc-bubble--${COLORS[i]} ${FLOATS[i % 3]}"
                 style="--d:${d}; --x:${cx}; --y:${cy}; animation-delay:-${i * 1.3}s">
              <span>${escapeHtml(k.word)}</span></div>`;
  }).join('');
}

function render(data) {
  document.querySelectorAll('[data-bind]').forEach(el => {
    const v = data[el.dataset.bind]; if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-bind-src]').forEach(el => {
    // Real submissions (via /submit.html) never collect a photo — hide the
    // element entirely rather than leaving a stale one from a previous
    // submission showing, or reserving blank space for it.
    const v = data[el.dataset.bindSrc];
    if (v) { el.src = v; el.style.display = ''; } else { el.style.display = 'none'; }
    el.closest('.cc-postcard')?.classList.toggle('cc-postcard--no-photo', !v);
  });
  document.getElementById('eta').classList.toggle('cc-eta--scheduled', !data.isLive);
  if (data.hasSecond){
    document.getElementById('eta2').classList.toggle('cc-bus2__eta--scheduled', !data.isLive2);
  }
  document.getElementById('bus2').hidden = !data.hasSecond;
  renderBubbles(data.keywords);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Fallback only now — used if the live /api/perspectives fetch fails
// before ever succeeding. Once that endpoint is reachable, it returns
// this exact same seed content on its first call (see api/perspectives.js),
// so there's no visible jump between "fallback" and "live" on a normal load.
const SAMPLE_DATA = {
  stopName: 'Chestnut St & 43rd St',
  peopleCount: 121,
  photo: 'images/featured.jpg', quote: 'Midway under snow storm!', author: 'Lucy Huang', date: '2022/ 01/03',
  keywords: [
    { word: 'Comforted', count: 48 }, { word: 'Energized', count: 27 }, { word: 'Nostalgic', count: 21 },
    { word: 'In the rain', count: 15 }, { word: 'Back garden', count: 13 }, { word: 'Revisitor', count: 9 },
    { word: 'Sunset', count: 7 }, { word: 'Architecture', count: 6 },
  ],
};

// ---------------------------------------------------------------------------
// Live bus data — same pattern used throughout this project: SEPTA route 21
// at Chestnut St & 43rd St (stop 590), absolute URL to the deployed API (so
// this works opened standalone too), live preferred with a scheduled
// fallback, polled every 20s.
// ---------------------------------------------------------------------------
const API_BASE = 'https://bus-interface-project.vercel.app';
const STOP_ID = '590';
const ROUTES = ['21'];
const POLL_MS = 20000;

function formatArrivalNote(iso){
  const t = new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase();
  return `arrives ${t}`;
}

// perspectivesData and busData are tracked separately (they update on
// different schedules/triggers) and merged into one render() call so
// neither fetch ever stomps on the other's fields.
let perspectivesData = { ...SAMPLE_DATA };
let busData = { route: '21', destination: 'Columbus-Dock', minutes: '–', isLive: false, arrivalNote: 'loading…', hasSecond: false };

function renderAll(){
  render({ ...perspectivesData, ...busData });
}

async function pollLiveData(){
  const next = { route: '21', destination: '—', minutes: '—', isLive: false, arrivalNote: 'no data', hasSecond: false };
  try {
    const res = await fetch(`${API_BASE}/api/stop-status?stopId=${STOP_ID}&routes=${ROUTES.join(',')}`);
    const data = await res.json();
    // data.arrivals is already the accurate list per the rules established
    // earlier in this project — live buses first, at most one scheduled
    // guess allowed through on a disrupted route, none of the phantom
    // entries that once didn't match Google Maps. nextService only ever
    // provides a single entry (a genuine overnight-style gap), so there's
    // no second bus to show in that case.
    const list = (data.arrivals && data.arrivals.length) ? data.arrivals : (data.nextService ? [data.nextService] : []);
    const [first, second] = list;
    if (first){
      next.route = first.route;
      next.destination = first.destination || '—';
      next.minutes = Math.max(0, first.etaMinutes);
      next.isLive = !!first.live;
      next.arrivalNote = formatArrivalNote(first.arrivalTimeIso);
    }
    if (second){
      next.hasSecond = true;
      next.route2 = second.route;
      next.destination2 = second.destination || '—';
      next.minutes2 = Math.max(0, second.etaMinutes);
      next.isLive2 = !!second.live;
      next.arrivalNote2 = formatArrivalNote(second.arrivalTimeIso);
    }
  } catch (err) {
    console.error('Live SEPTA fetch failed, keeping last known values:', err);
    return; // don't stomp the screen with placeholder dashes on a transient failure
  }
  busData = next;
  renderAll();
}

// ---------------------------------------------------------------------------
// Live perspectives (keyword bubbles + featured postcard + people count) —
// api/perspectives.js auto-seeds itself with the original design's sample
// content on first call, so this never shows an empty/broken screen even
// before anyone has submitted anything for real.
// ---------------------------------------------------------------------------
const PERSPECTIVES_POLL_MS = 15000;

function formatDate(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
}

async function fetchPerspectives(){
  try {
    const res = await fetch(`${API_BASE}/api/perspectives`);
    const data = await res.json();
    perspectivesData = {
      stopName: SAMPLE_DATA.stopName,
      id: (data.featured && data.featured.id) || null,
      keywords: (data.keywords && data.keywords.length) ? data.keywords : SAMPLE_DATA.keywords,
      quote: (data.featured && data.featured.quote) || SAMPLE_DATA.quote,
      author: (data.featured && data.featured.author) || SAMPLE_DATA.author,
      date: (data.featured && data.featured.timestamp) ? formatDate(data.featured.timestamp) : SAMPLE_DATA.date,
      // Only the seed submission has a real photo — a real submission with
      // none should show no photo at all, never fall back to the seed's.
      photo: (data.featured && data.featured.photo) ? data.featured.photo : null,
      featuredKeywords: (data.featured && data.featured.keywords) || [],
      peopleCount: data.peopleCount ?? SAMPLE_DATA.peopleCount,
    };
  } catch (err) {
    console.error('Live perspectives fetch failed, keeping last known values:', err);
    return;
  }
  renderAll();
}

// ---------------------------------------------------------------------------
// "Refresh themes" is Phase 2 — the manual trigger that calls Claude on
// whatever's still pending. Real submissions (via /submit.html) already
// show up here on their own via the regular fetchPerspectives poll below;
// this button is the only deliberately-manual step left.
// ---------------------------------------------------------------------------
const TAG_COLORS = ['cc-postcard__tag--0', 'cc-postcard__tag--1', 'cc-postcard__tag--2', 'cc-postcard__tag--3'];
function renderTagSpans(keywords){
  return (keywords || []).slice(0, 2)
    .map((kw, i) => `<span class="cc-postcard__tag ${TAG_COLORS[i % TAG_COLORS.length]}">${escapeHtml(kw)}</span>`)
    .join('');
}

// ---------------------------------------------------------------------------
// "New submission dropped" sequence, run once per "Refresh themes" call that
// actually processed something. Order matters here (see the CSS comment
// above cc-envelope-closed/-open for the exact timeline):
//   1. The real postcard fades out (.is-leaving) and its data is swapped
//      while invisible — nothing changes on screen yet.
//   2. The closed envelope pops in and holds — the postcard stays hidden
//      underneath, so only the envelope is visible.
//   3. The envelope "opens": its open layer is a clone of #postcard itself
//      (same classes — tilt, conditional photo, tag row, meta), so this is
//      the actual reveal of the new content.
//   4. The clone holds, then starts fading out. The real postcard is
//      revealed at that exact moment (ENVELOPE_REVEAL_AT_MS), already
//      showing identical content, so the crossfade is seamless.
//   5. A little after that, the tag row quietly retires on the real
//      postcard, settling into the plain, permanent state.
// ---------------------------------------------------------------------------
const ENVELOPE_TOTAL_MS = 34000;
const ENVELOPE_REVEAL_AT_MS = 32200; // must match the 94.71% keyframe in city-connector.css
const POSTCARD_FRESH_EXTRA_MS = 4000; // how long the real postcard keeps its tag row after being revealed

async function swapPostcard(freshlyProcessed){
  const postcard = document.getElementById('postcard');
  postcard.classList.add('is-leaving');
  await new Promise(resolve => setTimeout(resolve, 650)); // matches the 0.6s CSS transition
  await fetchPerspectives(); // swaps quote/author/date/photo/id while invisible

  // /api/perspectives is edge-cached for a few seconds (see its
  // Cache-Control header) so this fetch — happening right after
  // refresh-themes.js just wrote the tags — can still return the
  // pre-tag (empty) keywords. Match by id against refresh-themes.js's own
  // (never-cached) response instead of assuming order — with more than
  // one submission pending at once, the featured one isn't always
  // processed[0].
  const match = (freshlyProcessed || []).find(p => p.id === perspectivesData.id);
  if (match) perspectivesData.featuredKeywords = match.keywords;

  document.getElementById('postcardTagList').innerHTML = renderTagSpans(perspectivesData.featuredKeywords);
  postcard.classList.add('is-fresh');
  // postcard stays hidden (is-leaving) until playEnvelopeReveal's timer
  // reveals it — do NOT remove is-leaving here, that was the bug: it made
  // the real postcard fade back in before the envelope even appeared.
  playEnvelopeReveal();
}

function playEnvelopeReveal(){
  const envelope = document.getElementById('envelope');
  const postcard = document.getElementById('postcard');

  document.getElementById('envQuote').textContent = `“${perspectivesData.quote}”`;
  document.getElementById('envAuthor').textContent = perspectivesData.author || 'Anonymous';
  document.getElementById('envDate').textContent = perspectivesData.date || '';
  document.getElementById('envTagList').innerHTML = renderTagSpans(perspectivesData.featuredKeywords);
  const envPhoto = document.getElementById('envPhoto');
  if (perspectivesData.photo){ envPhoto.src = perspectivesData.photo; envPhoto.style.display = ''; }
  else { envPhoto.style.display = 'none'; }
  envPhoto.closest('.cc-postcard').classList.toggle('cc-postcard--no-photo', !perspectivesData.photo);

  envelope.classList.remove('is-playing');
  void envelope.offsetWidth; // reflow, so re-adding the class restarts the CSS animation
  envelope.classList.add('is-playing');

  setTimeout(() => postcard.classList.remove('is-leaving'), ENVELOPE_REVEAL_AT_MS);
  setTimeout(() => postcard.classList.remove('is-fresh'), ENVELOPE_REVEAL_AT_MS + POSTCARD_FRESH_EXTRA_MS);
}

async function refreshThemes(){
  const btn = document.getElementById('refreshBtn');
  const status = document.getElementById('simulateStatus');
  btn.disabled = true;
  status.textContent = 'Sending pending submissions to Claude…';
  try {
    const res = await fetch(`${API_BASE}/api/refresh-themes`, { method: 'POST' });
    const result = await res.json();
    if (result.ok){
      status.textContent = result.processedCount
        ? `Processed ${result.processedCount}: ` + result.processed.map(p => p.keywords.join('/')).join(', ')
        : 'Nothing pending to process.';
      if (result.processedCount){
        await swapPostcard(result.processed);
      }
    } else {
      status.textContent = result.error || 'Failed to refresh.';
    }
  } catch (err) {
    console.error('refreshThemes failed:', err);
    status.textContent = 'Failed — see console.';
  }
  btn.disabled = false;
}

document.getElementById('refreshBtn').addEventListener('click', refreshThemes);

renderAll();
pollLiveData();
setInterval(pollLiveData, POLL_MS);
fetchPerspectives();
setInterval(fetchPerspectives, PERSPECTIVES_POLL_MS);
</script>
</body>
</html>
